<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f2937">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Lug Dimensions | Devshashi</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f1ec;--card:#fff;--ink:#14171c;--muted:#5d6470;--line:#dcd8cf;
  --al:#3d6f9e;--al-bg:#e6eef6;--cu:#b4572a;--cu-bg:#f8e9e0;
  --ok:#1a7a46;--warn-bg:#fff4d6;--warn:#8a5a00;--gold:#c9972a;--gold-ink:#111;
  --pic:#e9e7e2;--stripe:#f8f7f4;--hover:#fff3d6;--on-color:#fff;--bar:#1f2937;--bar-ink:#fff;--key-bg:#fffaf0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e232b;--ink:#eef0f3;--muted:#a3abb7;--line:#343b46;--pic:#d9d7d2;--stripe:#232932;--hover:#3a3220;--al:#4a82b8;--al-bg:#22344a;--cu:#c4683a;--cu-bg:#3d2a20;--bar:#0c0f13;--bar-ink:#fff;--key-bg:#2a2518;--ok:#4cc386;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e232b;--ink:#eef0f3;--muted:#a3abb7;--line:#343b46;--pic:#d9d7d2;--stripe:#232932;--hover:#3a3220;--al:#4a82b8;--al-bg:#22344a;--cu:#c4683a;--cu-bg:#3d2a20;--bar:#0c0f13;--bar-ink:#fff;--key-bg:#2a2518;--ok:#4cc386;color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:62px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.top .back{background:var(--bar-ink);color:var(--bar);font-weight:800;font-size:18px;border-radius:12px;padding:10px 16px;white-space:nowrap}
.top .title{font-weight:700;font-size:18px;line-height:1.2;flex:1;min-width:0}
.top .title small{display:block;font-weight:400;font-size:13px;opacity:.75}
.top .home{background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:12px;padding:10px 14px}
main{max-width:1100px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2.grp{display:flex;align-items:center;gap:10px;font-size:22px;margin:22px 0 12px}
h2.grp .dot{width:18px;height:18px;border-radius:50%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{background:var(--card);border-radius:18px;overflow:hidden;text-align:left;border:3px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column;transition:transform .1s}
.tile:active{transform:scale(.98)}
.tile.al{border-color:var(--al-bg)} .tile.cu{border-color:var(--cu-bg)}
.tile .pic{height:150px;background:var(--pic) center/contain no-repeat}
.tile .txt{padding:12px 14px 14px}
.tile .nm{font-weight:800;font-size:18px;line-height:1.25}
.tile .hi{color:var(--muted);font-size:16px;margin-top:2px}
.tile .cnt{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px}
.al .cnt{background:var(--al-bg);color:var(--al)} .cu .cnt{background:var(--cu-bg);color:var(--cu)}
.search{display:flex;gap:8px;margin-bottom:6px}
.search input{flex:1;font-size:19px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.search input:focus{outline:none;border-color:var(--gold)}
.hint{color:var(--muted);font-size:14px}
.res{margin-top:12px;display:grid;gap:8px}
.res button{background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;border-left:6px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.res button.al{border-left-color:var(--al)} .res button.cu{border-left-color:var(--cu)}
.res b{font-size:18px}
.prodhead{display:grid;grid-template-columns:1fr;gap:12px;background:var(--card);border-radius:18px;padding:12px;margin-bottom:14px}
.prodhead img{border-radius:12px;background:var(--pic);cursor:zoom-in;max-height:300px;margin:0 auto;object-fit:contain}
.meta{font-size:14px;color:var(--muted)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--bar);color:var(--bar-ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.pill.light{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.sizegrp{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px}
.sizegrp h3{font-size:24px;margin-bottom:8px}
.sizegrp h3 span{font-size:15px;color:var(--muted);font-weight:600}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sz{border-radius:14px;padding:14px 10px;text-align:center;font-weight:800;font-size:22px;color:var(--on-color);line-height:1.15;min-height:76px}
.al .sz{background:var(--al)} .cu .sz{background:var(--cu)}
.sz small{display:block;font-size:13px;font-weight:600;opacity:.9;margin-top:4px}
.sz:active{filter:brightness(.9)}
.dhead{border-radius:18px;padding:16px;color:var(--on-color);margin-bottom:14px}
.al .dhead{background:var(--al)} .cu .dhead{background:var(--cu)}
.dhead .big{font-size:36px;font-weight:900;line-height:1.05}
.dhead .sub{font-size:17px;margin-top:6px;opacity:.95}
.dhead .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dhead .chip{background:rgba(255,255,255,.2);border-radius:10px;padding:6px 12px;font-weight:700;font-size:17px}
.warn{background:var(--warn-bg);color:var(--warn);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;font-weight:700;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:14px}
.dc{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;border:2px solid transparent}
.dc.key{border-color:var(--gold);background:var(--key-bg)}
.dc .lbl{font-weight:800;font-size:17px}
.dc .hi{color:var(--muted);font-size:15px}
.dc .val{font-size:40px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.05}
.dc .val .u{font-size:18px;font-weight:700;color:var(--muted);margin-left:4px}
.dc .sym{display:inline-block;font-size:14px;font-weight:800;background:var(--ink);color:var(--bg);border-radius:8px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.dc .calc{font-size:12px;color:var(--ok);font-weight:700;margin-top:2px}
.dc.na .val{font-size:22px;color:var(--muted)}
.sect{font-size:20px;font-weight:800;margin:18px 0 10px}
.drawing{background:var(--card);border-radius:18px;padding:12px;margin-bottom:14px}
.drawing img{cursor:zoom-in;border-radius:10px;margin:0 auto;max-height:420px;object-fit:contain}
.drawing p{font-size:14px;color:var(--muted);margin-top:8px;text-align:center}
.foot{font-size:14px;color:var(--muted);background:var(--card);border-radius:14px;padding:12px 14px}
.navrow{display:flex;gap:10px;margin:14px 0}
.navrow button{flex:1;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;font-weight:800;font-size:17px}
.navrow button:disabled{opacity:.3}
.tblwrap{overflow-x:auto;background:var(--card);border-radius:16px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;font-size:13px}
tbody tr{cursor:pointer} tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:hover{background:var(--hover)}
td.k{font-weight:800}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;flex-direction:column}
.zoom.on{display:flex}
.zoom .bar{display:flex;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));color:#fff;align-items:center}
.zoom .bar button{background:#fff;color:#111;font-weight:800;border-radius:12px;padding:10px 16px;font-size:17px}
.zoom .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.zoom .sc img{width:100%;max-width:none;margin:0 auto}
.zoom .sc.big img{width:250%}
@media (min-width:760px){
  .prodhead{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center}
  .dhead .big{font-size:44px}
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<div class="zoom" id="zoom">
  <div class="bar"><span id="zoomTitle"></span><span style="display:flex;gap:8px"><button id="zoomToggle">Zoom +</button><button id="zoomClose">Close ✕</button></span></div>
  <div class="sc" id="zoomSc"><img id="zoomImg" alt=""></div>
</div>
<script src="data.js"></script>
<script>
(function(){
const DATA = window.LUG_DATA;
const byId = Object.fromEntries(DATA.map(p=>[p.id,p]));
const $app = document.getElementById('app'), $top = document.getElementById('top');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Field dictionary: label (English), hindi, symbol in catalogue drawing
const F = {
  A:   ['Inner Dia (ID)','अंदर का व्यास','øA'],
  C:   ['Outer Dia (OD)','बाहर का व्यास','øC'],
  WALL:['Wall Thickness','दीवार की मोटाई','(C−A)÷2'],
  bolt:['Bolt / Hole Size','बोल्ट / छेद का साइज़','E'],
  E:   ['Hole Dia','छेद का व्यास','øE'],
  D:   ['Palm Width','पाम की चौड़ाई','D'],
  F:   ['Palm Thickness (Flat)','पाम (फ्लैट) की मोटाई','F'],
  B:   ['Barrel Length','बैरल की लंबाई','B'],
  K:   ['Neck Length','गर्दन (मोड़) की लंबाई','K'],
  G:   ['Palm End → Hole Centre','पाम के सिरे से छेद के सेंटर तक','G'],
  H:   ['Hole Centre → Neck','छेद के सेंटर से गर्दन तक','H'],
  GH:  ['Palm Length (G+H)','पाम की लंबाई','G+H'],
  J:   ['Total Length','कुल लंबाई','J'],
  pkg: ['Std. Packing (pcs)','स्टैंडर्ड पैकिंग (पीस)','']
};
// Per-kind overrides and display order
const K = {
  lug:    {order:['A','C','WALL','F','D','bolt','B','K','G','H','GH','J','pkg'], key:['A','C','WALL','F']},
  solder: {order:['A','C','WALL','F','D','E','B','K','G','H','J','pkg'], key:['A','C','WALL','F']},
  inline: {order:['A','C','WALL','J'], key:['A','C','WALL','J'],
           over:{J:['Total Length (Cutting Length)','कुल लंबाई (कटिंग लंबाई)','J']}},
  reducer:{order:['A','C','WALL','D','D1','B','K','GH','J'], key:['A','C','WALL','D'],
           over:{D:['Pin Dia','पिन का व्यास','øD'],D1:['Pin Flat Size','पिन फ्लैट साइज़','D-1'],B:['Barrel Length','बैरल की लंबाई','B'],
                 K:['Taper Length','टेपर की लंबाई','K'],GH:['Pin Length (G+H)','पिन की लंबाई','G+H']}},
  pin:    {order:['A','C','WALL','D','B','J','type','pkg'], key:['A','C','WALL','D'],
           over:{D:['Pin Dia','पिन का व्यास','D'],type:['Pin Type','पिन टाइप','Type'],B:['Barrel Length','बैरल की लंबाई','B']},
           extraTitle:'Insulated / Pre-Insulated versions', extra:['J1','cpi','A1','cpd'],
           overExtra:{J1:['Insulated: Insulation Length','इंसुलेटेड: इंसुलेशन लंबाई','J-1'],cpi:['Insulated Cat No.','इंसुलेटेड कैट नंबर',''],
                      A1:['Pre-Insulated: Sleeve ID','प्री-इंसुलेटेड: स्लीव ID','øA-1'],cpd:['Pre-Insulated Cat No.','प्री-इंसुलेटेड कैट नंबर','']}},
  ring:   {order:['A','D','bolt','B','G','L1'], key:['A','D','B','L1'],
           over:{A:['Barrel Inner Dia (ID)','बैरल का अंदर का व्यास','øA'],D:['Ring / Fork Width','रिंग / फोर्क की चौड़ाई','D'],
                 G:['Hole Centre → End','छेद के सेंटर से सिरे तक','G'],L1:['Total Length','कुल लंबाई','L-1']},
           extraTitle:'Insulated / Pre-Insulated versions', extra:['C','L1i','rsi','A1','L1p','psd'],
           overExtra:{C:['Insulated: Insulation OD','इंसुलेटेड: इंसुलेशन OD','øC'],L1i:['Insulated: Total Length','इंसुलेटेड: कुल लंबाई','L-1'],
                      rsi:['Insulated Cat No.','इंसुलेटेड कैट नंबर',''],A1:['Pre-Insulated: Sleeve Dia','प्री-इंसुलेटेड: स्लीव व्यास','øA-1'],
                      L1p:['Pre-Insulated: Total Length','प्री-इंसुलेटेड: कुल लंबाई','L-1'],psd:['Pre-Insulated Cat No.','प्री-इंसुलेटेड कैट नंबर','']}},
};
K.ringbig = {order:K.ring.order, key:K.ring.key, over:K.ring.over};
const NOUNIT = new Set(['bolt','type','pkg','cpi','cpd','rsi','psd']);

function lab(kind,k,extra){
  const d = K[kind]; const o = (extra? d.overExtra : d.over)||{};
  return o[k] || F[k] || [k,'',k];
}
function wall(r){ if(r.A==null||r.C==null) return null; return Math.round((parseFloat(r.C)-parseFloat(r.A))/2*100)/100; }
function fmtWall(w){ return (w==null)?null:(Number.isInteger(w)?w.toFixed(1):String(w)); }
function hasWall(p){ return ['lug','solder','inline','reducer','pin'].includes(p.kind); }
function val(p,r,k){ if(k==='WALL') return hasWall(p)? fmtWall(wall(r)) : undefined; return r[k]; }
function sizeTxt(p,r){ return r.size + ' ' + p.unit; }

function setTop(back,title,sub){
  $top.innerHTML = (back?`<button class="back" onclick="history.back()">← Back</button>`:'') +
    `<div class="title">${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}</div>` +
    (back?`<button class="home" onclick="location.hash='home'">⌂ Home</button>`:'');
}

// ---------- HOME ----------
function home(q){
  setTop(false,'Lug Dimensions / लग के नाप','Choose the item you are making · जो आइटम बना रहे हैं उसे चुनें');
  const tile = p => `<button class="tile ${p.group}" onclick="location.hash='#${p.id}'">
      <div class="pic" style="background-image:url('${p.img}')"></div>
      <div class="txt"><div class="nm">${esc(p.name)}</div><div class="hi">${esc(p.hi)}</div>
      <span class="cnt">${p.rows.length} sizes</span></div></button>`;
  $app.innerHTML = `
    <div class="search"><input id="q" type="search" inputmode="search" placeholder="Search Cat No. or size (e.g. 221 or 35)" value="${esc(q||'')}"></div>
    <div class="hint">Type a catalogue number or mm² size · कैट नंबर या साइज़ लिखें</div>
    <div class="res" id="res"></div>
    <h2 class="grp"><span class="dot" style="background:var(--al)"></span>Aluminium / एल्युमिनियम</h2>
    <div class="tiles">${DATA.filter(p=>p.group==='al').map(tile).join('')}</div>
    <h2 class="grp"><span class="dot" style="background:var(--cu)"></span>Copper / कॉपर</h2>
    <div class="tiles">${DATA.filter(p=>p.group==='cu').map(tile).join('')}</div>
    <p class="foot" style="margin-top:20px">All sizes in <b>mm</b>. Tolerance <b>±5%</b>. Wall thickness is calculated as (OD − ID) ÷ 2. Data from catalogue photos; tap <b>Catalogue Page</b> on any item to see the original chart.</p>`;
  const inp = document.getElementById('q');
  const run = ()=>search(inp.value);
  inp.addEventListener('input', run); if(q) search(q);
}
function search(q){
  const res = document.getElementById('res'); q=(q||'').trim().toLowerCase();
  if(!q){res.innerHTML='';return;}
  const out=[];
  DATA.forEach(p=>p.rows.forEach((r,i)=>{
    const cats=[r.cat,r.cpi,r.cpd,r.rsi,r.psd].filter(Boolean).map(s=>s.toLowerCase());
    const hit = cats.includes(q) || r.size.toLowerCase()===q;
    if(hit) out.push({p,r,i});
  }));
  res.innerHTML = out.length ? out.slice(0,60).map(({p,r,i})=>`<button class="${p.group}" onclick="location.hash='#${p.id}-s${i}'">
     <span><b>${esc(sizeTxt(p,r))}${r.bolt?' · '+esc(r.bolt):''}</b><br><span class="meta">${esc(p.name)}</span></span>
     <span class="meta">Cat No.<br><b style="color:var(--ink)">${esc(r.cat)}</b></span></button>`).join('')
     : `<div class="hint" style="padding:8px 0">Nothing found · कुछ नहीं मिला</div>`;
}

// ---------- PRODUCT (size list) ----------
function product(p, showTable){
  setTop(true,p.name,p.hi);
  const groups=[]; p.rows.forEach((r,i)=>{ let g=groups.find(g=>g.size===r.size); if(!g){g={size:r.size,items:[]};groups.push(g);} g.items.push({r,i}); });
  const btn = ({r,i}) => `<button class="sz" onclick="location.hash='#${p.id}-s${i}'">${r.bolt?esc(r.bolt):esc(r.size)}<small>${r.bolt?esc(r.size)+' '+esc(p.unit)+' · ':''}Cat ${esc(r.cat)}${r.type?' · Type '+esc(r.type):''}</small></button>`;
  $app.innerHTML = `<div class="${p.group}">
    <div class="prodhead"><img src="${esc(p.img)}" alt="${esc(p.name)} drawing" onclick="zoom('${p.img}','Drawing')">
      <div><div class="meta">Material: <b>${esc(p.material)}</b></div>
      ${p.note?`<div class="meta" style="margin-top:4px">${esc(p.note)}</div>`:''}
      <div class="meta" style="margin-top:4px">All sizes in mm · Tolerance ±5%</div>
      <div class="btnrow" style="margin-top:12px">
        <button class="pill" onclick="zoom('${p.page}','Catalogue Page')">📄 Catalogue Page</button>
        <button class="pill light" onclick="location.hash='#${p.id}${showTable?'':'-table'}'">${showTable?'▦ Size Buttons':'☰ Full Table'}</button>
      </div></div></div>
    <div class="sect">Choose size (${esc(p.unit)}) · साइज़ चुनें</div>
    ${showTable? table(p) : groups.map(g=>`<div class="sizegrp"><h3>${esc(g.size)} <span>${esc(p.unit)}</span></h3><div class="sizes">${g.items.map(btn).join('')}</div></div>`).join('')}
  </div>`;
}
function table(p){
  const d=K[p.kind]; const cols=d.order.filter(k=>k==='WALL'?hasWall(p):p.rows.some(r=>r[k]!=null));
  const ex=(d.extra||[]).filter(k=>p.rows.some(r=>r[k]!=null));
  const head = [['size',p.unit],...cols.map(k=>[k,lab(p.kind,k)[2]||lab(p.kind,k)[0]]),['cat','Cat No.'],...ex.map(k=>[k,lab(p.kind,k,true)[0]])];
  return `<div class="hint" style="margin-bottom:8px">Tap any row to open it big · बड़ा देखने के लिए लाइन दबाएँ</div><div class="tblwrap"><table><thead><tr>${head.map(h=>`<th>${esc(h[1])}</th>`).join('')}</tr></thead><tbody>${
    p.rows.map((r,i)=>`<tr onclick="location.hash='#${p.id}-s${i}'">${head.map(([k])=>{const v=k==='size'?r.size:val(p,r,k);return `<td class="${k==='size'||k==='cat'?'k':''}">${v==null?'–':esc(v)}</td>`}).join('')}</tr>`).join('')
  }</tbody></table></div>`;
}

// ---------- DETAIL ----------
function card(p,r,k,isKey,extra){
  const [en,hi,sym]=lab(p.kind,k,extra); const v=val(p,r,k);
  if(v===undefined) return '';
  const na = v==null;
  const unit = NOUNIT.has(k)?'':'<span class="u">mm</span>';
  return `<div class="dc ${isKey?'key':''} ${na?'na':''}"><div class="lbl">${esc(en)}${sym?`<span class="sym">${esc(sym)}</span>`:''}</div><div class="hi">${esc(hi)}</div>
    <div class="val">${na?'Not in catalogue':esc(v)+unit}</div>${k==='WALL'?'<div class="calc">✓ Calculated: (OD − ID) ÷ 2</div>':''}</div>`;
}
function detail(p,i){
  const r=p.rows[i]; if(!r){location.hash='#'+p.id;return;}
  const d=K[p.kind];
  setTop(true, sizeTxt(p,r)+(r.bolt?' · '+r.bolt:''), p.name);
  const keys=d.key.filter(k=>k!=='WALL'||hasWall(p));
  const rest=d.order.filter(k=>!keys.includes(k) && (k==='WALL'?hasWall(p):(r[k]!=null || p.rows.some(x=>x[k]!=null))));
  const ex=(d.extra||[]).filter(k=>r[k]!=null);
  $app.innerHTML = `<div class="${p.group}">
    <div class="dhead"><div class="big">${esc(sizeTxt(p,r))}</div><div class="sub">${esc(p.name)}<br>${esc(p.hi)}</div>
      <div class="chips"><span class="chip">Cat No. ${esc(r.cat)}</span>${r.bolt?`<span class="chip">Bolt ${esc(r.bolt)}</span>`:''}${r.type?`<span class="chip">Type ${esc(r.type)}</span>`:''}</div></div>
    <div class="sect">Main sizes · मुख्य नाप</div>
    <div class="cards">${keys.map(k=>card(p,r,k,true)).join('')}</div>
    <div class="sect">Other sizes · बाकी नाप</div>
    <div class="cards">${rest.map(k=>card(p,r,k,false)).join('')}</div>
    ${ex.length?`<div class="sect">${esc(d.extraTitle)}</div><div class="cards">${ex.map(k=>card(p,r,k,false,true)).join('')}</div>`:''}
    <div class="drawing"><img src="${esc(p.img)}" alt="Drawing with letters" onclick="zoom('${p.img}','Drawing')"><p>Letters on the drawing (A, C, D, F, J…) match the boxes above. Tap to zoom.</p></div>
    <div class="navrow"><button ${i>0?'':'disabled'} onclick="location.hash='#${p.id}-s${i-1}'">◀ Smaller</button><button ${i<p.rows.length-1?'':'disabled'} onclick="location.hash='#${p.id}-s${i+1}'">Bigger ▶</button></div>
    <div class="btnrow" style="margin-bottom:14px"><button class="pill" onclick="zoom('${p.page}','Catalogue Page')">📄 See Original Catalogue Page</button></div>
    <div class="foot">Material: ${esc(p.material)} · All sizes in mm · Tolerance ±5%${p.note?' · '+esc(p.note):''}</div>
  </div>`;
}

// ---------- ZOOM ----------
const $z=document.getElementById('zoom'),$zs=document.getElementById('zoomSc'),$zt=document.getElementById('zoomToggle');
window.zoom=function(src,t){ document.getElementById('zoomImg').src=src; document.getElementById('zoomTitle').textContent=t; $zs.classList.remove('big'); $zt.textContent='Zoom +'; $z.classList.add('on'); };
$zt.onclick=()=>{ const b=$zs.classList.toggle('big'); $zt.textContent=b?'Zoom −':'Zoom +'; };
document.getElementById('zoomClose').onclick=()=>$z.classList.remove('on');

// ---------- ROUTER ----------
function route(){
  $z.classList.remove('on');
  const h=decodeURIComponent(location.hash.replace(/^#/,''));
  let m;
  if(byId[h]) product(byId[h],false);
  else if((m=h.match(/^(.+)-table$/)) && byId[m[1]]) product(byId[m[1]],true);
  else if((m=h.match(/^(.+)-s(\d+)$/)) && byId[m[1]]) detail(byId[m[1]],parseInt(m[2],10));
  else home('');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route); route();
})();
</script>
</body>
</html>
